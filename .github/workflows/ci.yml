name: VT Solutions - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preparar-entorno:
    name: Preparar entorno Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            api-tests/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm ci

      - name: Instalar dependencias de pruebas API
        working-directory: ./api-tests
        run: npm ci

      - name: Confirmar preparación del entorno
        run: echo "Entorno de VT Solutions preparado correctamente"
