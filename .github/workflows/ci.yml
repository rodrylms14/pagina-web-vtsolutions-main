name: VT Solutions - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fallo_controlado:
        description: 'Demostrar que una assertion fallida detiene el pipeline'
        type: boolean
        default: false

jobs:
  preparar-entorno:
    name: Preparar entorno Node.js
    # Evitar el kernel de Ubuntu 26 incompatible con MongoDB (SERVER-121912).
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            api-tests/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm ci

      - name: Instalar dependencias de pruebas API
        working-directory: ./api-tests
        run: npm ci

      - name: Confirmar preparación del entorno
        run: echo "Entorno de VT Solutions preparado correctamente"
      - name: Ejecutar pruebas API
        working-directory: ./api-tests
        env:
          TEST_MONGODB_SERVER: mongodb://127.0.0.1:27017
          API_BASE_URL: http://127.0.0.1:4001
        run: |
          if [ "${{ inputs.fallo_controlado }}" = "true" ]; then
            npm run demo:entrega -- ci --fallo-controlado
          else
            npm run demo:entrega -- ci
          fi

      - name: Guardar evidencias de pruebas API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: api-tests/evidencias/entrega30/ci*
          retention-days: 14
          if-no-files-found: warn
